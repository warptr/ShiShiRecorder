name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CAPTURECAP_KEYSTORE_FILE: ${{ runner.temp }}/capturecap-release.p12
      CAPTURECAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CAPTURECAP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CAPTURECAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: 允许执行 Gradle Wrapper
        run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: 安装 Android 构建组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: 恢复 Release 签名
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CAPTURECAP_KEYSTORE_FILE"
      - name: 构建签名 APK
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: 校验 APK 签名
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: 保存 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 柿柿录音-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --title "柿柿录音 $GITHUB_REF_NAME" --generate-notes
