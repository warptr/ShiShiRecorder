name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: 安装 Android 构建组件
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: 构建与静态检查
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: 保存 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 柿柿录音-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
